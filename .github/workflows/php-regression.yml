name: PHP regression

on:
  push:
    branches:
      - feature/headless-ai-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
      - name: PHP syntax
        run: |
          php -l think
          php -l tests/regression/source_inventory.php
          php -l tests/regression/baseline_runner_contract.php
          php -l tests/regression/outbound_inventory_contract.php
          php -l tests/regression/outbound_inventory.php
          php -l tests/regression/run_baseline.php
          php -l tests/regression/migration_discovery.php
          php -l tests/regression/migration_cli_contract.php
          php -l tests/regression/migration_mysql_ddl.php
          php -l tests/regression/migration_contract.php
          php -l tests/regression/public_id_generator.php
          php -l tests/regression/vod_ext_public_id.php
          php -l tests/regression/vod_workflow.php
          php -l tests/regression/vod_playback_codec.php
          php -l tests/regression/vod_extension_contract.php
          php -l tests/regression/vod_extension_hook.php
          php -l tests/regression/run_foundation.php
          php -l tests/regression/content_job_contract.php
          php -l tests/regression/content_job_lifecycle.php
          php -l tests/regression/content_job_worker.php
          php -l tests/regression/hardened_http.php
          php -l tests/regression/ai_normalization_validator.php
          php -l tests/regression/ai_run_repository.php
          php -l tests/regression/field_governance.php
          php -l tests/regression/ai_normalization_pipeline.php
          php -l tests/regression/duplicate_candidate_scoring.php
          php -l tests/regression/duplicate_candidate_decisions.php
          php -l tests/regression/duplicate_merge.php
          php -l tests/regression/run_duplicate_tmdb.php
          php -l tests/regression/run_ai_jobs.php
          php -l tests/integration/mysql_foundation.php
          php -l tests/integration/native_vod_paths.php
          php -l application/common/util/SchemaMigrationService.php
          php -l application/common/util/PublicIdGenerator.php
          php -l application/common/util/VodWorkflow.php
          php -l application/common/util/VodPlaybackCodec.php
          php -l application/common/util/VodExtensionService.php
          php -l application/common/util/ContentJobRepository.php
          php -l application/common/util/ContentJobWorker.php
          php -l application/common/util/ExternalHttpPolicy.php
          php -l application/common/util/HardenedHttpClient.php
          php -l application/common/util/AiNormalizationValidator.php
          php -l application/common/util/AiRunRepository.php
          php -l application/common/util/FieldGovernance.php
          php -l application/common/util/AiNormalizationPipeline.php
          php -l application/common/util/AiNormalizationJobHandler.php
          php -l application/common/util/DuplicateCandidateScorer.php
          php -l application/common/util/DuplicateCandidateRepository.php
          php -l application/common/util/DuplicateCandidateDecisionService.php
          php -l application/common/util/DuplicateMergeService.php
          php -l application/common/model/VodExt.php
          php -l application/common/model/MetaTerm.php
          php -l application/common/model/VodMetaTerm.php
          php -l application/common/model/VodFieldState.php
          php -l application/common/model/ContentJob.php
          php -l application/common/model/ContentJobRun.php
          php -l application/common/model/ContentAiRun.php
          php -l application/common/model/ContentDuplicateCandidate.php
          php -l application/common/model/ContentMergeSnapshot.php
          php -l application/common/model/Vod.php
          php -l application/common/model/Collect.php
          php -l application/command/MaccmsMigrate.php
          php -l application/command/MaccmsJobs.php
      - name: Baseline runner contract
        run: php tests/regression/baseline_runner_contract.php
      - name: Outbound inventory contract
        run: php tests/regression/outbound_inventory_contract.php
      - name: Baseline regression suite
        run: php tests/regression/run_baseline.php
      - name: Foundation regression suite
        run: php tests/regression/run_foundation.php
      - name: AI jobs regression suite
        run: php tests/regression/run_ai_jobs.php
      - name: Duplicate and TMDB regression suite
        run: php tests/regression/run_duplicate_tmdb.php
