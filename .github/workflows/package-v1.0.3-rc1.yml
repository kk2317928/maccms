name: Build v1.0.3 RC1 test package

on:
  push:
    branches:
      - feature/headless-ai-v1
    paths:
      - '.github/workflows/package-v1.0.3-rc1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build clean release archive
        run: |
          set -euo pipefail
          candidate_sha=948b51d25462238746a22bc43910fea5f13d096a
          package_root=/tmp/maccms-headless-ai-v1.0.3-rc1
          mkdir -p "$package_root"
          git archive "$candidate_sha" | tar -x -C "$package_root"
          test -f "$package_root/install.php"
          test -f "$package_root/upload/.gitkeep"
          test -f "$package_root/vendor/topthink/think-captcha/src/Captcha.php"
          test -f "$package_root/application/common/util/SchemaMigrationService.php"
          test -f "$package_root/application/data/migrations/20260918000100_foundation.sql"
          test -f "$package_root/application/admin/controller/ContentWorkspace.php"
          test -f "$package_root/application/common/util/VodExtensionAdminService.php"
          grep -F "SchemaMigrationService" "$package_root/application/install/controller/Index.php"
          grep -F "智能內容工作區" "$package_root/application/admin/common/auth.php"
          grep -F 'name="vod_ext[title_tw]"' "$package_root/application/admin/view_new/vod/info.html"
          grep -F 'name="vod_ext[title_en]"' "$package_root/application/admin/view_new/vod/info.html"
          cd /tmp
          zip -qr maccms-headless-ai-v1.0.3-rc1.zip maccms-headless-ai-v1.0.3-rc1
          sha256sum maccms-headless-ai-v1.0.3-rc1.zip > maccms-headless-ai-v1.0.3-rc1.zip.sha256
          unzip -t maccms-headless-ai-v1.0.3-rc1.zip
      - uses: actions/upload-artifact@v4
        with:
          name: maccms-headless-ai-v1.0.3-rc1
          path: |
            /tmp/maccms-headless-ai-v1.0.3-rc1.zip
            /tmp/maccms-headless-ai-v1.0.3-rc1.zip.sha256
          if-no-files-found: error
          retention-days: 14
