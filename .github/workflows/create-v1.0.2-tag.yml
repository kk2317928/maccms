name: Create v1.0.2 tag

on:
  push:
    branches:
      - feature/headless-ai-v1
    paths:
      - '.github/workflows/create-v1.0.2-tag.yml'

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create annotated release tag
        env:
          TAG_NAME: headless-ai-v1.0.2
          TAG_TARGET: ea7a57cd1ca81ed9a567c92cb20a6b2606ddec55
        run: |
          test "$(git cat-file -t "$TAG_TARGET")" = commit
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG_NAME"; then
            echo "Tag already exists" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG_NAME" "$TAG_TARGET" -m "Headless AI v1.0.2 - restore complete MACCMS distribution dependencies"
          git push origin "refs/tags/$TAG_NAME"
