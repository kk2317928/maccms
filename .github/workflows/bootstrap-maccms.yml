name: Bootstrap pinned MACCMS baseline

on:
  push:
    paths:
      - .github/workflows/bootstrap-maccms.yml

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Import pinned upstream and create development branch
        shell: bash
        run: |
          set -euo pipefail
          import_dir="$(mktemp -d)"
          git clone --depth 1 https://github.com/magicblack/maccms10.git "$import_dir"
          git -C "$import_dir" checkout 4466885edc38744c4a8cbfbea171546dfb67d84d
          test "$(git -C "$import_dir" rev-parse HEAD)" = "4466885edc38744c4a8cbfbea171546dfb67d84d"
          rsync -a --delete --exclude='.git' --exclude='.github' --exclude='docs' "$import_dir/" ./
          rm -f .maccms-upstream
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: establish pinned maccms upstream baseline"
          fi
          git push origin HEAD:main
          git branch -f feature/headless-ai-v1 HEAD
          git push --force origin feature/headless-ai-v1
