name: MySQL 5.7 foundation

on:
  push:
    branches:
      - feature/headless-ai-v1
    paths:
      - '.github/workflows/mysql57-foundation.yml'
      - 'think'
      - 'application/command.php'
      - 'application/command/MaccmsMigrate.php'
      - 'application/common/util/SchemaMigrationService.php'
      - 'application/data/migrations/**'
      - 'tests/integration/mysql_foundation.php'
      - 'tests/integration/content_job_lifecycle.php'
      - 'application/common/util/ContentJobRepository.php'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mysql57:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: maccms_ci_57
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      MACCMS_TEST_DATABASE: maccms_ci_57
      MACCMS_TEST_HOST: 127.0.0.1
      MACCMS_TEST_PORT: 3306
      MACCMS_TEST_USER: root
      MACCMS_TEST_PASSWORD: root
      MACCMS_TEST_MYSQL_FAMILY: '5.7'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: pdo_mysql
          coverage: none
      - name: Configure disposable database
        run: sed -i "s/'database'        => 'maccms10'/'database'        => 'maccms_ci_57'/" application/database.php
      - name: PHP syntax
        run: |
          php -l think
          php -l tests/integration/mysql_foundation.php
          php -l tests/integration/content_job_lifecycle.php
      - name: First migration run
        run: |
          set +e
          output=$(php think maccms:migrate 2>&1)
          status=$?
          set -e
          echo "$output"
          test "$status" -eq 0
          grep -q 'done, applied=7, skipped=0' <<< "$output"
      - name: Second migration run is a no-op
        run: |
          set +e
          output=$(php think maccms:migrate 2>&1)
          status=$?
          set -e
          echo "$output"
          test "$status" -eq 0
          grep -q 'done, applied=0, skipped=7' <<< "$output"
      - name: Verify MySQL 5.7 schema invariants
        run: php tests/integration/mysql_foundation.php
      - name: Verify MySQL 5.7 content job lifecycle
        run: php tests/integration/content_job_lifecycle.php
