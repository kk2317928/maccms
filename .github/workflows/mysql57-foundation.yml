name: MySQL 5.7 foundation

on:
  push:
    branches:
      - feature/headless-ai-v1
    paths:
      - 'index.php'
      - 'api.php'
      - 'application/config.php'
      - 'application/api/controller/v1/**'
      - 'application/common/exception/ApiV1ExceptionHandler.php'
      - 'application/common/util/ApiV1*.php'
      - 'tests/regression/api_v1_foundation.php'
      - '.github/workflows/mysql57-foundation.yml'
      - 'think'
      - 'application/command.php'
      - 'application/command/MaccmsMigrate.php'
      - 'application/common/util/SchemaMigrationService.php'
      - 'application/data/migrations/**'
      - 'tests/integration/mysql_foundation.php'
      - 'tests/integration/content_job_lifecycle.php'
      - 'application/common/util/ContentJobRepository.php'
      - 'application/common/util/ContentRepairService.php'
      - 'application/command/MaccmsRepairContent.php'
      - 'tests/integration/content_repair_mysql.php'
      - 'tests/integration/content_lifecycle_mysql.php'
      - 'application/common/util/TaxonomyDictionaryService.php'
      - 'tests/integration/taxonomy_dictionary_mysql.php'
      - 'application/common/util/ExternalImageIngestionService.php'
      - 'application/common/util/TmdbPosterJobHandler.php'
      - 'tests/integration/tmdb_poster_ingestion_mysql.php'
      - 'application/common/util/DuplicateWorkflowStatus.php'
      - 'tests/integration/duplicate_admin_actions_mysql.php'
      - 'application/common/util/VodRepeatRepairService.php'
      - 'application/command/MaccmsRepairVodRepeat.php'
      - 'application/data/migrations/20260921000100_vod_repeat_unique.sql'
      - 'tests/integration/vod_repeat_repair_mysql.php'
      - 'application/common/util/ContentImport*.php'
      - 'tests/integration/api_v1_import_mysql.php'
      - 'application/common/util/ContentAdminRoutePolicy.php'
      - 'application/admin/controller/Base.php'
      - 'application/admin/controller/ContentWorkspace.php'
      - 'application/common/util/ContentAdminPolicy.php'
      - 'application/common/util/ContentJobAdminService.php'
      - 'application/common/util/ContentAdminAudit.php'
      - 'tests/regression/admin_permission_compatibility.php'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mysql57:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: maccms_ci_57
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      MACCMS_TEST_DATABASE: maccms_ci_57
      MACCMS_TEST_HOST: 127.0.0.1
      MACCMS_TEST_PORT: 3306
      MACCMS_TEST_USER: root
      MACCMS_TEST_PASSWORD: root
      MACCMS_TEST_MYSQL_FAMILY: '5.7'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: pdo_mysql
          coverage: none
      - name: Configure disposable database
        run: sed -i "s/'database'        => 'maccms10'/'database'        => 'maccms_ci_57'/" application/database.php
      - name: PHP syntax
        run: |
          php -l think
          php -l tests/integration/mysql_foundation.php
          php -l tests/integration/content_job_lifecycle.php
          php -l application/command/MaccmsAnalytics.php
          php -l tests/integration/api_v1_analytics.php
          php -l tests/integration/api_v1_import_mysql.php
          php -l tests/integration/content_repair_mysql.php
          php -l tests/integration/content_lifecycle_mysql.php
          php -l application/common/util/TaxonomyDictionaryService.php
          php -l tests/integration/taxonomy_dictionary_mysql.php
          php -l application/common/util/ExternalImageIngestionService.php
          php -l application/common/util/TmdbPosterJobHandler.php
          php -l tests/integration/tmdb_poster_ingestion_mysql.php
          php -l application/common/util/DuplicateWorkflowStatus.php
          php -l tests/integration/duplicate_admin_actions_mysql.php
          php -l application/common/util/VodRepeatRepairService.php
          php -l application/command/MaccmsRepairVodRepeat.php
          php -l tests/integration/vod_repeat_repair_mysql.php
      - name: Install native schema
        run: mysql --protocol=tcp --host=127.0.0.1 --port=3306 --user=root --password=root --database=maccms_ci_57 < application/install/sql/install.sql
      - name: First migration run
        run: |
          set +e
          output=$(php think maccms:migrate 2>&1)
          status=$?
          set -e
          echo "$output"
          test "$status" -eq 0
          grep -q 'done, applied=22, skipped=0' <<< "$output"
      - name: Second migration run is a no-op
        run: |
          set +e
          output=$(php think maccms:migrate 2>&1)
          status=$?
          set -e
          echo "$output"
          test "$status" -eq 0
          grep -q 'done, applied=0, skipped=22' <<< "$output"
      - name: Verify MySQL 5.7 schema invariants
        run: php tests/integration/mysql_foundation.php
      - name: Verify MySQL 5.7 content job lifecycle
        run: php tests/integration/content_job_lifecycle.php
      - name: Verify API v1 analytics database boundaries
        run: php tests/integration/api_v1_analytics.php
      - name: Verify protected import ledger
        run: php tests/integration/api_v1_import_mysql.php
      - name: Verify safe content repair
        run: php tests/integration/content_repair_mysql.php
      - name: Verify taxonomy dictionary
        run: php tests/integration/taxonomy_dictionary_mysql.php
      - name: Verify complete content lifecycle
        run: php tests/integration/content_lifecycle_mysql.php
      - name: Verify TMDB poster ingestion
        run: php tests/integration/tmdb_poster_ingestion_mysql.php
      - name: Verify duplicate admin actions
        run: php tests/integration/duplicate_admin_actions_mysql.php
      - name: Verify native duplicate-name repair
        run: php tests/integration/vod_repeat_repair_mysql.php
